<div class="block" data-block-id="${element.uuid}"
     ondragover="global.state.noteEditor.onDragOver('${element.uuid}', event)"
     ondrop="global.state.noteEditor.onDrop('${element.uuid}', event)">
    <div class="controls">
        <div class="add" onclick="global.state.noteEditor.createBlock({position: ${element.position}})">+</div>
        <div class="drag" draggable="true"
             ondragstart="global.state.noteEditor.onDragStart('${element.uuid}', event)"
             ondragend="global.state.noteEditor.onDragEnd('${element.uuid}', event)">
            <img src="/static/icons/material/handle.svg"/>
        </div>
        <div class="delete" onclick="global.state.noteEditor.deleteBlock('${element.uuid}')">
            <img src="/static/icons/material/trash.svg"/>
        </div>
    </div>
    <span class="content editable-block ${element.type!=='text'?'note-'+element.type:''}" contenteditable="${checkChannelRight(global.state.activeChan.id, 'note', 'edit-notes') ? 'true' : 'false'}"
          spellcheck="false"
          data-placeholder="Press '/' for commands"
          oninput="global.state.noteEditor.onInput('${element.uuid}', event)"
          onkeydown="global.state.noteEditor.onKeyDown('${element.uuid}', event)"
          onblur="global.state.noteEditor.onBlur('${element.uuid}', event)"
          onfocus="global.state.noteEditor.onFocus('${element.uuid}', event)">${MDToRender(element.content)}</span>
</div>
