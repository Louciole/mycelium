<div class="permission ${rightEditable(element.name) ? '' : 'disabled'}" data-right="${element.name}">
    <div class="inline space-between">
        <h3>${_t(element.label)}</h3>
        <label class="switch">
            <input type="checkbox" onchange="editRolePerm(event, '${element.name}')" ${element.name in (global.state.currentRole.permissions || {}) ? 'checked' : ''} ${rightEditable(element.name) ? '' : 'disabled'}>
            <span class="slider"></span>
        </label>
    </div>
    <p>${_t(element.description)}</p>
</div>
