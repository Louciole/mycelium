<div id="drive-dialog" class="drive-overlay" onclick="if (event.target === this) closeDriveMoveDialog()">
<div class="drive-dialog" role="dialog" aria-modal="true" aria-label="${escapeHTML(element.title)}">
    <div class="drive-dialog-title">${escapeHTML(element.title)}</div>
    <div class="drive-dialog-crumbs">${element.crumbs.map((c, i) => i === element.crumbs.length - 1
        ? `<b>${escapeHTML(c.name)}</b>`
        : `<button type="button" class="drive-crumb" onclick="loadDriveMoveFolder(${c.id ?? 'null'})">${escapeHTML(c.name)}</button><span class="drive-crumb-sep">›</span>`).join('')}</div>
    <div class="drive-dialog-list">
        ${element.loading ? `<div class="drive-empty">${_t('Loading…')}</div>`
        : element.folders.length ? element.folders.map(f => `<button type="button" class="drive-dialog-folder" data-move-folder="${f.id}"
                ${f.moving ? 'disabled' : ''} onclick="loadDriveMoveFolder(${f.id})">
                <img class="icon" src="/static/icons/material/folder.svg" alt=""/>${escapeHTML(f.foldername)}</button>`).join('')
        : `<div class="drive-empty">${_t('No subfolder')}</div>`}
    </div>
    <div class="drive-dialog-actions">
        <button type="button" class="drive-bar-btn" onclick="closeDriveMoveDialog()">${_t('Cancel')}</button>
        <button type="button" id="drive-move-here" class="drive-new-btn" ${element.disabled ? 'disabled' : ''} onclick="confirmDriveMove()">${_t('Move here')}</button>
    </div>
</div>
</div>
