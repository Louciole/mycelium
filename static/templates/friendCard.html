<div class="item">
    <div class="container">
        <div class="inline">
            <div class="pfp green" data-content="()=>{return 'background-image:url(/static/attachments/'+global.users[getRelevantUser(element)]?.pfp+');'}" style="background-image:url(/static/attachments/${escapeHTML(global.users[getRelevantUser(element)].pfp)}">
                <div class="activity-wrapper">
                    <div class="activity ${global.users[getRelevantUser(element)].status.icon}"></div>
                </div>
            </div>
            <div class="vertical">
                <h5>${escapeHTML(global.users[getRelevantUser(element)].display)}</h5>
                <p>${escapeHTML(global.users[getRelevantUser(element)].status.text)}</p>
            </div>
        </div>
        <div class="inline reverse">
            <div class="action" data-id="${element.id}"  onclick="toggleModale('more-friends',event)">
                <span class="tooltip bottom" >${_t("More")}</span>
                <img class="icon medium" src="/static/icons/material/more.svg">
            </div>
            <div class="action" onclick="goToConv(${element.conv})">
                <span class="tooltip bottom">${_t("Message")}</span>
                <img class="icon medium" src="/static/icons/material/message.svg">
            </div>
        </div>
    </div>
</div>
