<div class="inline space-between">
    <div class="inline">
        <div class="circle red" style="${global.users[getRelevantUser(element)]?.pfp ? 'background-image:url(/static/attachments/'+escapeHTML(global.users[getRelevantUser(element)].pfp)+');background-size:cover;' : ''}"></div>
        <div class="name">${escapeHTML(global.users[getRelevantUser(element)].display)}</div>
        <div class="username">${escapeHTML(global.users[getRelevantUser(element)].username)}</div>
    </div>
    <div class="inline">
        <label>
            <input type="checkbox" ${global.convs[global.state.activeConv].members.includes(getRelevantUser(element))?'checked':''} name="check"  onclick="addPendingUser(event, ${getRelevantUser(element)})"/>
            <span class="checkbox"></span>
        </label>
    </div>
</div>
