<div class="roles-toolbar">
    <div class="search-field">
        <img class="icon" src="/static/icons/material/search.svg">
        <input type="text" id="perm-search" placeholder="${_t('Rechercher des permissions')}" oninput="renderRolePermissions()" autocomplete="off">
    </div>
</div>
<div class="perm-clear" style="${canManageRole(global.state.currentRole) ? '' : 'display:none'}">
    <span class="link" onclick="clearRolePerms()">${_t("Effacer les permissions")}</span>
</div>
<div id="role-perm-list"></div>
