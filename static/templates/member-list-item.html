<div class="inline" style="width: 100%">
    <div class="pfp red" onclick="toggleProfileInfo(${element.id},event)" data-target="style" data-content="()=>{return 'background-image:url(/static/attachments/'+global.users[element.id].pfp+');'}" style="background-image:url(/static/attachments/${escapeHTML(global.users[element.id].pfp)}">
        <div class="activity-wrapper">
            ${Subscribe("global.users["+element.id+"].status.icon",()=>{return("<div class='activity "+global.users[element.id].status.icon)+"'></div>"},"grow")}
        </div>
    </div>
    <div class="name" data-uid="${element.id}" onclick="toggleProfileInfo(${element.id},event)" ${memberColor(element.id) ? "style='--text2:" + escapeHTML(memberColor(element.id)) + "'" : ""}>
        ${escapeHTML(global.users[element.id].display)}
    </div>
</div>
