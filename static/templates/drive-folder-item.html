<div class="drive-folder-item drive-item" data-folder-id="${element.id}"
     draggable="true"
     ondragstart="onDriveItemDrag(event, 'folder', ${element.id})"
     ondragover="onDriveFolderDragOver(event)"
     ondragleave="onDriveFolderDragLeave(event)"
     ondrop="onDriveFolderDrop(event, ${element.id})"
     ondblclick="openDriveFolder(${element.id})"
     oncontextmenu="openDriveItemMenu(event, 'folder', ${element.id})"
     onclick="onDriveItemClick(event, 'folder', ${element.id})">
    <img class="icon drive-folder-icon" src="/static/icons/material/folder.svg" alt=""/>
    <span class="drive-item-name" title="${escapeHTML(element.foldername)}">${escapeHTML(element.foldername)}</span>
    <button type="button" class="drive-more" aria-label="${_t('Actions')}" onclick="openDriveItemMenu(event, 'folder', ${element.id})"><img class="icon" src="/static/icons/material/more.svg" alt=""/></button>
</div>
