<div class="drive-file-item drive-item" data-file-id="${element.id}"
     draggable="true"
     ondragstart="onDriveItemDrag(event, 'file', ${element.id})"
     ondblclick="openDriveFile(${element.id})"
     oncontextmenu="openDriveItemMenu(event, 'file', ${element.id})"
     onclick="onDriveItemClick(event, 'file', ${element.id})">
    <div class="drive-card-head">
        ${driveKindBadge(element.filename)}
        <span class="drive-item-name" title="${escapeHTML(element.filename)}">${escapeHTML(element.filename)}</span>
        <button type="button" class="drive-more" aria-label="${_t('Actions')}" onclick="openDriveItemMenu(event, 'file', ${element.id})"><img class="icon" src="/static/icons/material/more.svg" alt=""/></button>
    </div>
    ${getDriveFilePreviewHtml(element)}
</div>
