<section class="menu-wrapper" id="server-invitation" style="display:none" onclick="closeMenu()">
    <div class="menu">
        <div class="close" onclick="closeMenu('#server-invitation')">+</div>
        <div class="steps" id="createServerSteps">
            <div class="step">
                <p>${_t("ENVOYER UN LIEN D'INVITATION A UN AMI")}</p>
                <div class="input-wrapper">
                    <input type="text" class="dark" value="${window.location.origin + '/' + global.state.currentInvitationId}" readonly style="padding-left: 0.7rem; flex: 1;">
                    <div class="icon-wrapper" onclick="copyInviteLink(this)" style="padding: 0 0.7rem;" title="${_t('Copier')}">
                        <img class="icon" src="/static/icons/material/copy.svg" alt="copy">
                    </div>
                </div>
                <p class="small">${_t("Ton lien d'invitation expire dans 7 jours.")}</p>
            </div>
        </div>
    </div>
</section>
