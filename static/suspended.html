<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Compte suspendu — Mycelium</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #1e1f22; color: #e0e0e0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            max-width: 480px; padding: 2.5rem; text-align: center;
            background: #2b2d31; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }
        .icon { font-size: 3rem; }
        h1 { margin: 0.5rem 0 1rem; font-size: 1.5rem; }
        .reason { background: #1e1f22; padding: 1rem; border-radius: 8px; margin: 1rem 0; font-style: italic; }
        .expiry { color: #b5bac1; font-size: 0.9rem; }
        a.logout {
            display: inline-block; margin-top: 1.5rem; padding: 0.6rem 1.4rem;
            background: #5865f2; color: #fff; text-decoration: none; border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚫</div>
        <h1 id="title">Votre compte a été suspendu</h1>
        <div class="reason" id="reason">…</div>
        <div class="expiry" id="expiry"></div>
        <a class="logout" href="/logout">Se déconnecter</a>
    </div>
    <script>
        fetch('/my_suspension').then(r => r.json()).then(data => {
            if (!data.suspended) { window.location.href = '/channels'; return; }
            document.getElementById('reason').textContent = data.reason || 'Aucune raison fournie.';
            const exp = document.getElementById('expiry');
            if (data.expires_at) {
                exp.textContent = 'Suspension jusqu’au ' + String(data.expires_at).slice(0, 16);
            } else {
                exp.textContent = 'Suspension permanente.';
            }
        }).catch(() => {});
    </script>
</body>
</html>
