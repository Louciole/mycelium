stages:
  - test
  - test-e2e
  - build
  - deploy

test:
  stage: test
  image: python:3.12-slim-bookworm

  services:
    - name: postgres:16
      alias: postgres

  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust

  before_script:
    # Install PostgreSQL client
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - apt-get install -y nginx && apt-get install -y nodejs npm sudo

    # Wait for PostgreSQL to be ready
    - until PGPASSWORD=postgres psql -h postgres -U postgres -c '\q'; do echo "Waiting for postgres..."; sleep 2; done

    # Create test database and user
    - PGPASSWORD=postgres psql -h postgres -U postgres -c "CREATE USER disclone_test WITH PASSWORD 'disclone1';" || echo "User already exists"
    - PGPASSWORD=postgres psql -h postgres -U postgres -c "ALTER USER disclone_test WITH SUPERUSER;" || echo "User might already be a superuser"
    - PGPASSWORD=postgres psql -h postgres -U postgres -c "CREATE DATABASE mycelium OWNER disclone_test;" || echo "Database might already exist"
    - PGPASSWORD=postgres psql -h postgres -U postgres -c "CREATE DATABASE uniauth OWNER disclone_test;" || echo "Database might already exist"


    - apt-get update && apt-get install -y git && apt-get install -y gcc
    - apt install -y libpq-dev
    - sed -i 's/DB_HOST = localhost/DB_HOST = postgres/g' server.ini
    - sed -i 's/DB_HOST = localhost/DB_HOST = postgres/g' tests/backend/server.ini

    # Install Playwright dependencies and browsers
    - npm ci
    - npx playwright install --with-deps chromium

  script:
    - echo 'Running tests...'
    - python -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - vesta install
    - vesta nginx setup
    - vesta nginx mime
    - vesta db init
    - ls /etc/nginx/sites-available/
    - nginx -t
    - service nginx restart
    # Backend tests talk to the real app, so it must be up before `vesta test`
    - python server.py &
    - timeout 60 sh -c 'until python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:9876/\")" 2>/dev/null; do sleep 1; done'
    - vesta test
    - npx playwright test --config tests/playwright.config.mjs


deploy-staging:
  stage: deploy
  # Runs on the gitlab-runner installed on the staging server itself
  # (shell executor, registered with the tag below). No SSH, no exposed ports.
  tags:
    - staging
  rules:
    - when: never
  # Start as soon as tests pass — don't wait behind the Android builds.
  needs:
    - job: test
  script:
    - ./misc/deploy_staging.sh "$CI_COMMIT_SHA"


build-apk:
  stage: build
  image: mingc/android-build-box:latest

  rules:
    - if: '$CI_COMMIT_BRANCH == "maine"'

  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=false"

  cache:
    key: "project-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/wrapper
      - .gradle/caches

  script:
    - cd capacitor-app
    - npm install
    - mkdir -p android/app
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/mycelium.keystore
    - npx cap sync android
    - cd android
    - chmod +x gradlew
    # Sign via the explicit signingConfig in app/build.gradle (forces v1+v2).
    # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD come
    # from CI variables and are already in the environment.
    - export ANDROID_KEYSTORE_FILE="$CI_PROJECT_DIR/capacitor-app/android/app/mycelium.keystore"
    - ./gradlew assembleRelease
    # Copy the exact signed artifact (never a stray *-unsigned.apk).
    - cp app/build/outputs/apk/release/app-release.apk "$CI_PROJECT_DIR/mycelium-release.apk"
    # Fail the build if the APK isn't properly signed with v2 (installable on API 30+).
    - |
      APKSIGNER="$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)"
      "$APKSIGNER" verify --verbose --print-certs "$CI_PROJECT_DIR/mycelium-release.apk"

  artifacts:
    name: "mycelium-release"
    paths:
      - mycelium-release.apk
    expire_in: 2 week

build-aab:
  stage: build
  image: mingc/android-build-box:latest

  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'

  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=false"

  cache:
    key: "project-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/wrapper
      - .gradle/caches

  script:
    - cd capacitor-app
    - npm install
    - mkdir -p android/app
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/mycelium.keystore
    - npx cap sync android
    - cd android
    - |
      if [ -z "$AAB_VERSION_CODE" ]; then
        echo "AAB_VERSION_CODE is not set. Define it in GitLab CI/CD variables before running build-aab."
        exit 1
      fi
      case "$AAB_VERSION_CODE" in
        ''|*[!0-9]*)
          echo "AAB_VERSION_CODE must be a positive integer. Got: $AAB_VERSION_CODE"
          exit 1
          ;;
      esac
      export ANDROID_VERSION_CODE="$AAB_VERSION_CODE"
      export ANDROID_VERSION_NAME="${AAB_VERSION_NAME:-$AAB_VERSION_CODE}"
    - echo "Building AAB versionName=$ANDROID_VERSION_NAME versionCode=$ANDROID_VERSION_CODE"
    - chmod +x gradlew
    - |
      ./gradlew bundleRelease \
        -PVERSION_CODE="$ANDROID_VERSION_CODE" \
        -PVERSION_NAME="$ANDROID_VERSION_NAME" \
        -Pandroid.injected.signing.store.file="$CI_PROJECT_DIR/capacitor-app/android/app/mycelium.keystore" \
        -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
        -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
        -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
    - cp app/build/outputs/bundle/release/*.aab "$CI_PROJECT_DIR/mycelium-release.aab"

  artifacts:
    name: "mycelium-release-aab"
    paths:
      - mycelium-release.aab
    expire_in: 2 week



publish-play-store:
  stage: deploy
  image: mingc/android-build-box:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "app-release" && $CI_PIPELINE_SOURCE == "push"'

  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    APP_VERSION_BASE: "1.0"

  before_script:
    - apt-get update -qq
    - apt-get install -y ruby-full build-essential
    - gem install fastlane

  script:
    - cd capacitor-app
    - npm ci
    - mkdir -p android/app
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/mycelium.keystore
    - npx cap sync android
    - cd android

    - |
      if [ -z "$APP_RELEASE_IID_START" ]; then
        echo "APP_RELEASE_IID_START is not set. Configure it in GitLab CI/CD variables."
        exit 1
      fi
      PATCH_VERSION=$((CI_PIPELINE_IID - APP_RELEASE_IID_START))
      if [ "$PATCH_VERSION" -le 0 ]; then
        echo "Computed patch version is invalid: $PATCH_VERSION"
        echo "APP_RELEASE_IID_START must be lower than current CI_PIPELINE_IID ($CI_PIPELINE_IID)."
        exit 1
      fi
      export ANDROID_VERSION_CODE="$PATCH_VERSION"
      export ANDROID_VERSION_NAME="$APP_VERSION_BASE.$PATCH_VERSION"
      echo "Building Android versionName=$ANDROID_VERSION_NAME versionCode=$ANDROID_VERSION_CODE"

    - echo "$SUPPLY_JSON_KEY_DATA" > play-store-key.json

    - chmod +x gradlew
    - ./gradlew bundleRelease \
      -PVERSION_CODE="$ANDROID_VERSION_CODE" \
      -PVERSION_NAME="$ANDROID_VERSION_NAME" \
      -Pandroid.injected.signing.store.file="$CI_PROJECT_DIR/capacitor-app/android/app/mycelium.keystore" \
      -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
      -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
      -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

    - fastlane supply --aab app/build/outputs/bundle/release/app-release.aab \
      --json_key play-store-key.json \
      --package_name "dev.carbonlab.mycelium.app" \
      --track "internal"